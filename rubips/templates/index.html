<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <title>TCFH/SOFT V5.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Audiowide&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon: #00f2ff; --bg: #050508; --panel: #0f0f16; }
        body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; overflow: hidden; }
        .hidden { display: none !important; }
        
        /* Kart Tasarımları */
        .card { background: var(--panel); border: 1px solid #222; transition: 0.2s; }
        .card:active { transform: scale(0.98); }
        .card.ps { border-top: 4px solid var(--neon); }
        .card.kafe { border-top: 4px solid #ff0055; }
        
        /* Admin/Garson Görünümü */
        .admin-only { display: none; } /* JS ile açılacak */
    </style>
</head>
<body>

    <div id="loginScreen" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center p-4">
        <h1 class="text-4xl font-bold text-cyan-400 mb-2" style="font-family:'Audiowide'">TCFH/SOFT</h1>
        <div class="bg-gray-900 p-6 rounded-2xl w-full max-w-sm border border-gray-800">
            <label class="text-xs text-gray-500 block mb-1">PERSONEL SEÇİN</label>
            <select id="loginUser" class="w-full bg-black border border-gray-700 text-white p-3 rounded mb-4">
                <option value="admin">Yönetici (Admin)</option>
                <option value="garson1">Garson Ali</option>
                <option value="garson2">Nargileci Memo</option>
            </select>
            <input type="password" id="loginPass" placeholder="Şifre Girin" class="w-full bg-black border border-gray-700 text-white p-3 rounded text-center mb-4">
            <button onclick="login()" class="w-full bg-cyan-600 text-black font-bold py-3 rounded">GİRİŞ YAP</button>
        </div>
    </div>

    <div id="mainApp" class="hidden h-screen flex flex-col">
        <header class="bg-black border-b border-gray-800 p-3 flex justify-between items-center">
            <div>
                <div class="font-bold text-lg leading-none">TCFH<span class="text-cyan-400">/SOFT</span></div>
                <div id="userBadge" class="text-[10px] text-gray-400">Giriş Yapılmadı</div>
            </div>
            
            <div class="text-right">
                <div class="text-[10px] text-gray-500" id="ciroLabel">SENİN SATIŞIN</div>
                <div class="text-xl font-bold text-green-400" id="canliCiro">₺0.00</div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-3" id="mainContent">
            
            <div id="tab-masalar">
                <div class="grid grid-cols-2 gap-3" id="masaGrid">
                    </div>
            </div>

            <div id="tab-yonetim" class="hidden">
                <h2 class="text-cyan-400 font-bold mb-4 border-b border-gray-800 pb-2">PERSONEL LİSTESİ & KASA</h2>
                
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="bg-gray-900 p-3 rounded border border-gray-800">
                        <div class="text-xs text-gray-500">TOPLAM KASA</div>
                        <div class="text-2xl font-bold text-green-400" id="adminTotalCiro">₺0.00</div>
                    </div>
                    <div class="bg-gray-900 p-3 rounded border border-gray-800">
                        <div class="text-xs text-gray-500">AÇIK MASALAR</div>
                        <div class="text-2xl font-bold text-white">5</div>
                    </div>
                </div>

                <div class="space-y-3" id="staffListArea">
                    </div>
                
                <button onclick="yeniPersonelEkle()" class="w-full mt-4 border border-dashed border-gray-600 text-gray-400 p-3 rounded hover:text-white hover:border-white">
                    + YENİ PERSONEL EKLE
                </button>
            </div>

        </main>

        <nav class="bg-black border-t border-gray-800 h-16 flex justify-around items-center">
            <button onclick="setTab('masalar')" class="text-cyan-400 flex flex-col items-center">
                <i class="fas fa-th-large text-xl"></i><span class="text-[10px]">MASALAR</span>
            </button>
            <button onclick="setTab('yonetim')" class="text-gray-500 flex flex-col items-center" id="navYonetim">
                <i class="fas fa-users-cog text-xl"></i><span class="text-[10px]">YÖNETİM</span>
            </button>
            <button onclick="logout()" class="text-red-500 flex flex-col items-center">
                <i class="fas fa-power-off text-xl"></i><span class="text-[10px]">ÇIKIŞ</span>
            </button>
        </nav>
    </div>

    <script>
        // SANAL VERİTABANI
        const users = [
            {id: 'admin', name: 'Patron', role: 'admin', pass: '1907', satis: 0},
            {id: 'garson1', name: 'Garson Ali', role: 'garson', pass: '1234', satis: 1450},
            {id: 'garson2', name: 'Nargileci Memo', role: 'garson', pass: '1234', satis: 850}
        ];

        let currentUser = null;

        function login() {
            const uid = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const user = users.find(u => u.id === uid);

            if(user && user.pass === pass) {
                currentUser = user;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                
                // KİMLİK AYARLARI
                document.getElementById('userBadge').innerText = user.name;
                
                if(user.role === 'admin') {
                    // Admin ise Toplam Kasayı Göster
                    const toplam = users.reduce((a, b) => a + b.satis, 0);
                    document.getElementById('canliCiro').innerText = `₺${toplam}`;
                    document.getElementById('adminTotalCiro').innerText = `₺${toplam}`;
                    document.getElementById('ciroLabel').innerText = "TOPLAM KASA";
                    renderStaffList();
                } else {
                    // Garson ise Sadece Kendi Satışını Göster
                    document.getElementById('canliCiro').innerText = `₺${user.satis}`;
                    document.getElementById('ciroLabel').innerText = "SENİN KAZANDIRDIĞIN";
                    // Yönetim sekmesini gizle
                    document.getElementById('navYonetim').classList.add('hidden');
                }
                
                renderMasalar();
            } else {
                alert("Şifre Hatalı!");
            }
        }

        function setTab(tab) {
            if(tab === 'masalar') {
                document.getElementById('tab-masalar').classList.remove('hidden');
                document.getElementById('tab-yonetim').classList.add('hidden');
            } else if(tab === 'yonetim') {
                document.getElementById('tab-masalar').classList.add('hidden');
                document.getElementById('tab-yonetim').classList.remove('hidden');
            }
        }

        function renderStaffList() {
            const list = document.getElementById('staffListArea');
            list.innerHTML = '';
            users.forEach(u => {
                list.innerHTML += `
                    <div class="bg-gray-900 p-3 rounded flex justify-between items-center border border-gray-800">
                        <div>
                            <div class="font-bold text-white">${u.name}</div>
                            <div class="text-[10px] text-gray-500 uppercase">${u.role}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-green-400 font-bold">₺${u.satis}</div>
                            <button class="text-[10px] text-cyan-400 underline">Düzenle</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderMasalar() {
            // Örnek Masalar
            const grid = document.getElementById('masaGrid');
            grid.innerHTML = '';
            for(let i=1; i<=6; i++) {
                grid.innerHTML += `
                    <div class="card ps p-4 rounded-xl min-h-[100px] flex flex-col justify-between">
                        <div class="font-bold">Masa ${i}</div>
                        <div class="text-right text-gray-400 text-sm">BOŞ</div>
                    </div>
                `;
            }
        }

        function logout() { location.reload(); }
        function yeniPersonelEkle() { alert("Yeni personel ekleme ekranı açılacak..."); }
    </script>
</body>
</html>
