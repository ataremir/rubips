<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    
    <title>TCFH/SOFT - MASTER PANEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* PWA açıldığında telefonun üst kısmındaki boşluğu yönetir */
        body { background: #050508; padding-top: env(safe-area-inset-top); }
        .admin-panel { background: #111; border: 1px solid #333; padding: 20px; border-radius: 15px; margin-top: 20px; }
        .user-card { background: #1a1a26; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div id="view-ayarlar" class="view-section">
        <div class="admin-panel">
            <h3 class="text-cyan-400 font-bold mb-4"><i class="fas fa-users-cog"></i> PERSONEL YETKİ VE ŞİFRE YÖNETİMİ</h3>
            
            <div id="staffList">
                <div class="user-card border border-gray-800">
                    <div>
                        <input type="text" id="editName_1" value="Garson Ali" class="bg-transparent border-b border-gray-700 focus:border-cyan-400 outline-none">
                        <div class="text-[10px] text-gray-500">ROL: GARSON</div>
                    </div>
                    <div class="flex gap-2">
                        <input type="password" id="editPass_1" placeholder="Yeni Şifre" class="bg-black text-xs p-1 rounded border border-gray-700 w-24">
                        <button onclick="updateStaff(1)" class="bg-cyan-600 text-black px-3 py-1 rounded text-xs font-bold">GÜNCELLE</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // PWA Kurulumu
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        // PERSONEL GÜNCELLEME (Python API'ye gönderir)
        async function updateStaff(userId) {
            const newName = document.getElementById(`editName_${userId}`).value;
            const newPass = document.getElementById(`editPass_${userId}`).value;

            const res = await fetch('/api/personel-guncelle', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId, newName, newPass })
            });
            
            if(res.ok) {
                alert("Personel bilgileri ve şifresi başarıyla güncellendi!");
            }
        }
    </script>
</body>
</html>
