<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TCFH/SOFT V7.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #050508; color: white; overflow: hidden; font-family: sans-serif; }
        
        /* CİHAZ SEÇİM EKRANI */
        #deviceSelector { position: fixed; inset: 0; background: black; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* PC MODU */
        body.pc-mode #main-layout { display: grid; grid-template-columns: 1fr 400px; height: 100vh; }
        body.pc-mode #mobile-nav { display: none; }
        
        /* MOBİL MODU */
        body.mobile-mode #main-layout { display: block; height: calc(100vh - 70px); overflow-y: auto; }
        body.mobile-mode #pc-sidebar { display: none; }
        body.mobile-mode #mobile-nav { display: flex; }

        .card { background: #111; border: 1px solid #333; padding: 15px; border-radius: 10px; cursor: pointer; }
        .card.active { border-color: #00f2ff; background: #001111; }
        .ready-badge { animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="deviceSelector">
        <h1 class="text-4xl font-bold text-cyan-400 mb-8">TCFH/SOFT</h1>
        <h2 class="text-gray-400 mb-4">Cihaz Türünü Seçin</h2>
        <div class="flex gap-6">
            <button onclick="setMode('pc')" class="bg-gray-800 p-6 rounded-xl border border-gray-600 hover:border-cyan-400">
                <i class="fas fa-desktop text-4xl mb-2 text-white"></i>
                <div class="text-xl">BİLGİSAYAR</div>
            </button>
            <button onclick="setMode('mobile')" class="bg-gray-800 p-6 rounded-xl border border-gray-600 hover:border-pink-400">
                <i class="fas fa-mobile-alt text-4xl mb-2 text-white"></i>
                <div class="text-xl">TELEFON</div>
            </button>
        </div>
    </div>

    <div id="app" class="hidden h-full flex flex-col">
        <header class="bg-black p-4 border-b border-gray-800 flex justify-between items-center">
            <div class="font-bold text-xl">TCFH/SOFT</div>
            <div id="syncStatus" class="text-[10px] text-green-500">● CANLI</div>
        </header>

        <div id="main-layout">
            <div class="p-4 overflow-y-auto">
                <div id="readyOrdersArea" class="hidden bg-green-900/30 border border-green-500 p-3 rounded mb-4 ready-badge">
                    <h3 class="font-bold text-green-400"><i class="fas fa-bell"></i> HAZIR SİPARİŞLER!</h3>
                    <div id="readyList" class="text-sm mt-1"></div>
                    <button onclick="clearReady()" class="text-[10px] underline mt-1">Temizle</button>
                </div>

                <div id="masaGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
            </div>

            <div id="pc-sidebar" class="bg-[#0a0a12] border-l border-gray-800 p-4 flex flex-col">
                <h2 id="sideTitle" class="text-2xl font-bold mb-4">MASA SEÇİN</h2>
                <div id="sideContent" class="hidden flex-col h-full">
                    <div id="sideOrders" class="flex-1 bg-black rounded p-2 overflow-y-auto mb-4"></div>
                    <div class="bg-gray-900 p-4 rounded">
                        <div class="flex justify-between text-xl font-bold mb-2">
                            <span>TOPLAM:</span> <span id="sideTotal" class="text-green-400">₺0.00</span>
                        </div>
                        <button class="w-full bg-green-600 py-3 rounded font-bold text-black mb-2">ÖDEME AL</button>
                    </div>
                </div>
                
                <div class="mt-4 pt-4 border-t border-gray-800">
                    <label class="text-xs text-gray-500">PS Saat Ücreti</label>
                    <input type="number" id="settingPs" class="bg-black border border-gray-600 text-white p-1 w-20 text-xs" onchange="saveSettings()">
                </div>
            </div>
        </div>

        <nav id="mobile-nav" class="hidden fixed bottom-0 w-full bg-black border-t border-gray-800 h-16 justify-around items-center">
            <button class="text-cyan-400 flex flex-col items-center"><i class="fas fa-th"></i><span class="text-[10px]">MASALAR</span></button>
            <button class="text-gray-500 flex flex-col items-center"><i class="fas fa-utensils"></i><span class="text-[10px]">MUTFAK</span></button>
        </nav>
    </div>

    <script>
        let db = {};
        let activeTableId = null;

        // 1. CİHAZ SEÇİMİ
        function setMode(mode) {
            document.body.classList.add(mode + '-mode');
            document.getElementById('deviceSelector').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            syncData(); // Verileri çekmeye başla
            setInterval(syncData, 2000); // Her 2 saniyede bir güncelle
        }

        // 2. VERİ SENKRONİZASYONU (CANLI)
        async function syncData() {
            try {
                const res = await fetch('/api/get-all');
                db = await res.json();
                renderUI();
                document.getElementById('syncStatus').style.color = '#00ff00';
            } catch (e) {
                document.getElementById('syncStatus').style.color = 'red';
            }
        }

        // 3. EKRANI ÇİZ
        function renderUI() {
            const grid = document.getElementById('masaGrid');
            grid.innerHTML = '';
            
            // PS Fiyat Ayarı
            document.getElementById('settingPs').value = db.settings.ps_rate;

            db.tables.forEach(t => {
                const div = document.createElement('div');
                div.className = `card ${t.id === activeTableId ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="font-bold text-lg">${t.name}</div>
                    <div class="text-xs text-gray-500">${t.status.toUpperCase()}</div>
                `;
                div.onclick = () => selectMasa(t.id);
                grid.appendChild(div);
            });

            if(activeTableId) updateSidePanel();
            checkReadyOrders();
        }

        function selectMasa(id) {
            activeTableId = id;
            if (document.body.classList.contains('mobile-mode')) {
                alert("Mobilde Detay Penceresi Açılır (Şimdilik Demo)");
            } else {
                updateSidePanel();
            }
        }

        function updateSidePanel() {
            const t = db.tables.find(x => x.id === activeTableId);
            document.getElementById('sideTitle').innerText = t.name;
            document.getElementById('sideContent').style.display = 'flex';
            // Burada adisyon listesi ve toplam hesaplanacak
        }

        // 4. AYAR KAYDETME (PS FİYATI DEĞİŞMİYOR SORUNU ÇÖZÜMÜ)
        async function saveSettings() {
            const val = document.getElementById('settingPs').value;
            await fetch('/api/update-settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ps_rate: val })
            });
            alert("Fiyat Güncellendi!");
        }

        // 5. HAZIR SİPARİŞ KONTROLÜ
        function checkReadyOrders() {
            // Demo mantığı: Eğer sipariş durumu 'hazir' ise buraya düşer
            // Mutfak entegrasyonu tamamlandığında burası dolacak
        }
    </script>
</body>
</html>
