<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TCFH/SOFT V8.0 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Audiowide&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --neon-blue: #00f2ff; 
            --neon-pink: #ff0055; 
            --bg-dark: #050508; 
            --card-bg: #0f0f16;
        }
        body { background: var(--bg-dark); color: white; font-family: 'Rajdhani', sans-serif; overflow: hidden; }

        /* FİLTRE BUTONLARI */
        .filter-btn {
            background: #1a1a26; border: 1px solid #333; color: #888;
            padding: 8px 16px; border-radius: 8px; font-weight: bold; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .filter-btn.active { background: var(--neon-blue); color: black; box-shadow: 0 0 15px rgba(0,242,255,0.3); border-color: var(--neon-blue); }
        .filter-btn.active-pink { background: var(--neon-pink); color: white; box-shadow: 0 0 15px rgba(255,0,85,0.3); border-color: var(--neon-pink); }

        /* MASA KARTLARI */
        .masa-card {
            background: var(--card-bg); border: 1px solid #222; border-radius: 12px;
            padding: 15px; position: relative; cursor: pointer; transition: all 0.2s;
            display: flex; flex-direction: column; justify-content: space-between;
            min-height: 110px;
        }
        .masa-card:hover { transform: translateY(-3px); }
        
        /* PS Tipi */
        .masa-card.ps { border-top: 3px solid var(--neon-blue); }
        .masa-card.ps.dolu { background: linear-gradient(180deg, rgba(0,242,255,0.05) 0%, rgba(0,0,0,0) 100%); border-color: var(--neon-blue); }
        
        /* Kafe Tipi */
        .masa-card.kafe { border-top: 3px solid var(--neon-pink); }
        .masa-card.kafe.dolu { background: linear-gradient(180deg, rgba(255,0,85,0.05) 0%, rgba(0,0,0,0) 100%); border-color: var(--neon-pink); }

        /* Iconlar */
        .icon-box { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .ps .icon-box { background: rgba(0,242,255,0.1); color: var(--neon-blue); }
        .kafe .icon-box { background: rgba(255,0,85,0.1); color: var(--neon-pink); }

        /* PC Sidebar */
        #pc-sidebar { border-left: 2px solid #1a1a1a; background: #0a0a0f; }
        @media(max-width: 1024px) { #pc-sidebar { display: none; } }
    </style>
</head>
<body>

    <div class="flex h-screen w-full">
        <div class="flex-1 flex flex-col h-full relative">
            
            <header class="bg-black p-4 border-b border-gray-800 flex justify-between items-center shrink-0">
                <div class="text-2xl font-bold tracking-wider" style="font-family:'Audiowide'">TCFH<span class="text-cyan-400">/SOFT</span></div>
                
                <div class="flex gap-2">
                    <button onclick="setFilter('all')" id="btn-all" class="filter-btn active"><i class="fas fa-layer-group"></i> HEPSİ</button>
                    <button onclick="setFilter('ps')" id="btn-ps" class="filter-btn"><i class="fas fa-gamepad"></i> PS SALONU</button>
                    <button onclick="setFilter('kafe')" id="btn-kafe" class="filter-btn"><i class="fas fa-coffee"></i> KAFE</button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-4 bg-[#050508]">
                <div id="masaGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                    </div>
            </main>

            <nav class="lg:hidden bg-black border-t border-gray-800 h-16 flex justify-around items-center shrink-0 z-50">
                <button class="text-cyan-400 flex flex-col items-center"><i class="fas fa-th-large"></i><span class="text-[10px]">MASALAR</span></button>
                <button class="text-gray-500 flex flex-col items-center"><i class="fas fa-utensils"></i><span class="text-[10px]">MUTFAK</span></button>
            </nav>
        </div>

        <div id="pc-sidebar" class="w-[400px] flex flex-col p-6">
            <h2 id="sideTitle" class="text-2xl font-bold mb-1 text-gray-500">MASA SEÇİLMEDİ</h2>
            <div id="sideStatus" class="text-xs text-gray-600 mb-6">---</div>
            
            <div class="flex-1 bg-[#111] rounded-xl border border-gray-800 mb-4 flex flex-col items-center justify-center text-gray-600">
                <i class="fas fa-hand-pointer text-3xl mb-2"></i>
                <p>İşlem yapmak için bir masa seçin</p>
            </div>
        </div>
    </div>

    <script>
        let db = { tables: [] };
        let currentFilter = 'all';

        // Sayfa Açılınca
        window.onload = () => {
            syncData();
            setInterval(syncData, 3000); // 3 saniyede bir güncelle
        };

        async function syncData() {
            try {
                const res = await fetch('/api/get-data');
                const data = await res.json();
                db.tables = data.tables;
                renderMasalar();
            } catch(e) { console.log("Veri çekilemedi"); }
        }

        // FİLTRELEME VE SIRALAMA MANTIĞI
        function setFilter(type) {
            currentFilter = type;
            
            // Buton Renklerini Ayarla
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('active', 'active-pink');
                b.style.color = '#888';
            });

            if(type === 'ps') document.getElementById('btn-ps').classList.add('active');
            else if(type === 'kafe') document.getElementById('btn-kafe').classList.add('active-pink');
            else document.getElementById('btn-all').classList.add('active');

            renderMasalar();
        }

        function renderMasalar() {
            const grid = document.getElementById('masaGrid');
            grid.innerHTML = '';

            // 1. FİLTRELE
            let filteredTables = db.tables.filter(t => {
                if(currentFilter === 'all') return true;
                return t.type === currentFilter;
            });

            // 2. SIRALA (Alfabetik ve Sayısal: Masa 1, Masa 2, Masa 10...)
            filteredTables.sort((a, b) => {
                return a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'});
            });

            // 3. ÇİZ
            filteredTables.forEach(t => {
                const isDolu = t.status === 'dolu';
                const icon = t.type === 'ps' ? 'fa-gamepad' : 'fa-smoking'; // Nargile için duman ikonu
                
                grid.innerHTML += `
                    <div onclick="openMasa(${t.id})" class="masa-card ${t.type} ${isDolu ? 'dolu' : ''}">
                        <div class="flex justify-between items-start">
                            <span class="font-bold text-lg text-white">${t.name}</span>
                            <div class="icon-box"><i class="fas ${icon}"></i></div>
                        </div>
                        
                        <div class="mt-4">
                            ${t.type === 'ps' ? 
                                `<div class="text-2xl font-mono font-bold text-white tracking-widest">
                                    ${isDolu ? '01:24' : '00:00'}
                                </div>` 
                                : 
                                `<div class="text-sm font-bold ${isDolu ? 'text-green-400' : 'text-gray-500'}">
                                    ${isDolu ? 'AÇIK - ADİSYON VAR' : 'BOŞ'}
                                </div>`
                            }
                        </div>
                    </div>
                `;
            });
        }

        function openMasa(id) {
            // Sağ Paneli Doldur (Basit Demo)
            const t = db.tables.find(x => x.id === id);
            if(window.innerWidth >= 1024) {
                document.getElementById('sideTitle').innerText = t.name;
                document.getElementById('sideTitle').className = "text-3xl font-bold mb-1 text-white";
                document.getElementById('sideStatus').innerText = t.type.toUpperCase() + " BÖLÜMÜ";
            } else {
                alert(t.name + " Mobil Modalı Açılacak");
            }
        }
    </script>
</body>
</html>
