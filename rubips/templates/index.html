<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <title>TCFH/SOFT V6.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Audiowide&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon: #00f2ff; --pink: #ff0055; --bg: #050508; --panel: #11111b; }
        body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; overflow: hidden; }

        /* PC (KASA) DÜZENİ */
        @media (min-width: 1024px) {
            #main-layout { display: grid; grid-template-columns: 1fr 420px; height: 100vh; }
            #mobile-nav { display: none; }
            #pc-sidebar { display: flex; flex-direction: column; border-left: 2px solid #222; background: #0a0a12; }
        }

        /* MOBİL (TELEFON) DÜZENİ */
        @media (max-width: 1023px) {
            #main-layout { display: block; height: calc(100vh - 65px); overflow-y: auto; }
            #pc-sidebar { display: none; }
            #mobile-nav { display: flex; position: fixed; bottom: 0; width: 100%; height: 65px; background: #0f0f16; border-top: 1px solid #222; z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
        }

        .card { background: var(--panel); border: 1px solid #222; border-radius: 12px; padding: 15px; cursor: pointer; transition: 0.2s; position: relative; }
        .card:hover { border-color: var(--neon); transform: translateY(-2px); }
        .card.ps { border-top: 4px solid var(--neon); }
        .card.active { border-color: var(--neon); background: #00f2ff1a; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="app">
        <div id="main-layout">
            <div class="flex flex-col h-full overflow-hidden relative">
                <header class="bg-black border-b border-gray-800 p-4 flex justify-between items-center h-16 shrink-0">
                    <div class="font-bold text-xl" style="font-family:'Audiowide'">TCFH<span class="text-cyan-400">/SOFT</span></div>
                    <div class="hidden lg:flex gap-6 text-sm font-bold text-gray-500">
                        <button onclick="setTab('masalar')" class="hover:text-white">MASALAR</button>
                        <button onclick="setTab('mutfak')" class="hover:text-white">MUTFAK</button>
                        <button onclick="setTab('yonetim')" class="hover:text-white">YÖNETİM</button>
                    </div>
                    <div class="flex items-center gap-4">
                        <span id="userStatus" class="text-[10px] bg-cyan-900/30 text-cyan-400 px-2 py-1 rounded">ADMİN AKTİF</span>
                        <i onclick="location.reload()" class="fas fa-power-off text-red-500 cursor-pointer"></i>
                    </div>
                </header>

                <main class="flex-1 overflow-y-auto p-4 bg-black" id="mainContent">
                    <div id="view-masalar">
                        <div id="masaGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-4 xl:grid-cols-5 gap-3">
                            </div>
                    </div>

                    <div id="view-yonetim" class="hidden">
                        <h2 class="text-xl font-bold text-cyan-400 mb-6">PERSONEL YÖNETİMİ & KAZANÇ</h2>
                        <div id="staffList" class="space-y-3">
                            </div>
                    </div>
                </main>
            </div>

            <aside id="pc-sidebar" class="p-6">
                <div id="activeMasaInfo" class="flex flex-col h-full">
                    <div class="border-b border-gray-800 pb-4 mb-4">
                        <h2 id="pcMasaAd" class="text-3xl font-bold text-white uppercase">MASA SEÇİN</h2>
                        <div id="pcMasaSure" class="text-cyan-400 font-mono text-2xl mt-1">00:00:00</div>
                    </div>
                    
                    <div id="pcAdisyon" class="flex-1 overflow-y-auto bg-gray-900/50 rounded-xl p-3 mb-4 border border-gray-800">
                        <p class="text-gray-600 text-center mt-10 text-sm">Ürün eklemek için masayı seçin.</p>
                    </div>

                    <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800">
                        <div class="flex justify-between text-2xl font-bold mb-4">
                            <span>TOPLAM:</span> <span id="pcToplam" class="text-green-400">₺0.00</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <button class="bg-green-600 text-black py-4 rounded-xl font-bold hover:bg-green-500 transition-all">NAKİT</button>
                            <button class="bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-500 transition-all">KART</button>
                        </div>
                    </div>
                </div>
            </aside>
        </div>

        <nav id="mobile-nav" class="flex justify-around items-center">
            <button onclick="setTab('masalar')" class="flex flex-col items-center text-cyan-400">
                <i class="fas fa-th-large text-xl"></i><span class="text-[10px] mt-1">MASALAR</span>
            </button>
            <button onclick="setTab('mutfak')" class="flex flex-col items-center text-gray-500">
                <i class="fas fa-utensils text-xl"></i><span class="text-[10px] mt-1">MUTFAK</span>
            </button>
            <button onclick="setTab('yonetim')" class="flex flex-col items-center text-gray-500">
                <i class="fas fa-users-cog text-xl"></i><span class="text-[10px] mt-1">YÖNETİM</span>
            </button>
        </nav>
    </div>

    <script>
        // PWA Kaydı
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }

        // Sekme Yönetimi
        function setTab(tabId) {
            document.querySelectorAll('#view-masalar, #view-yonetim').forEach(e => e.classList.add('hidden'));
            document.getElementById('view-' + tabId).classList.remove('hidden');
            
            // Mobil nav renk güncelleme
            document.querySelectorAll('#mobile-nav button').forEach(b => b.classList.replace('text-cyan-400', 'text-gray-500'));
            event.currentTarget.classList.replace('text-gray-500', 'text-cyan-400');
        }
    </script>
</body>
</html>
