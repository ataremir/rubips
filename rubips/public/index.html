<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>RUBI PS | Admin Panel</title>
    <style>
        :root { --neon: #00f2ff; --bg: #0a0a0a; --danger: #ff4d4d; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; }
        .header { border-bottom: 2px solid var(--neon); padding: 20px; text-shadow: 0 0 10px var(--neon); }
        
        .admin-controls { background: #1a1a1a; padding: 20px; margin: 20px; border-radius: 10px; border: 1px solid #333; }
        input { padding: 10px; border-radius: 5px; border: 1px solid var(--neon); background: #000; color: white; }
        button { padding: 10px 20px; cursor: pointer; background: var(--neon); border: none; font-weight: bold; border-radius: 5px; }

        .masa-konteynir { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        
        .masa-kart { 
            background: #111; border: 2px solid #333; padding: 20px; border-radius: 15px;
            transition: 0.3s; position: relative;
        }
        .masa-kart.dolu { border-color: var(--danger); box-shadow: 0 0 15px var(--danger); }
        .masa-kart.bos { border-color: #2ecc71; }

        .sure { font-size: 24px; font-weight: bold; margin: 10px 0; }
        .btn-kapat { background: var(--danger); margin-top: 10px; }
        .btn-sil { position: absolute; top: 5px; right: 5px; background: none; color: #555; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>RUBI PS YÖNETİM PANELİ</h1>
    </div>

    <div class="admin-controls">
        <input type="number" id="masaNo" placeholder="Masa No (Örn: 5)">
        <button onclick="masaEkle()">YENİ MASA EKLE</button>
    </div>

    <div id="masalar" class="masa-konteynir">
        </div>

    <script>
        const API_URL = ""; // Railway üzerinde boş bırakırsak kendi adresini kullanır

        async function masalariGetir() {
            const res = await fetch('/api/masalar');
            const masalar = await res.json();
            const liste = document.getElementById('masalar');
            liste.innerHTML = '';

            masalar.forEach(masa => {
                const div = document.createElement('div');
                div.className = `masa-kart ${masa.durum === 'dolu' ? 'dolu' : 'bos'}`;
                div.innerHTML = `
                    <button class="btn-sil" onclick="masaSil(${masa.id})">X</button>
                    <h3>MASA ${masa.id}</h3>
                    <div class="sure">${masa.kalan_sure || '00:00'}</div>
                    <p>Durum: ${masa.durum.toUpperCase()}</p>
                    ${masa.durum === 'bos' 
                        ? `<button onclick="masayiAc(${masa.id})">MASAYI AÇ (1 SAAT)</button>` 
                        : `<button class="btn-kapat" onclick="masayiKapat(${masa.id})">HESABI KES</button>`
                    }
                `;
                liste.appendChild(div);
            });
        }

        async function masaEkle() {
            const id = document.getElementById('masaNo').value;
            if(!id) return;
            await fetch('/api/masa-ekle', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id })
            });
            masalariGetir();
        }

        async function masaSil(id) {
            if(!confirm('Masayı silmek istediğine emin misin?')) return;
            await fetch(`/api/masa-sil/${id}`, { method: 'DELETE' });
            masalariGetir();
        }

        // Şimdilik sadece ekranı güncelliyoruz, bir sonraki adımda server'a bağlayacağız
        function masayiAc(id) { alert('Masa ' + id + ' açılıyor... Birazdan süreyi bağlayacağız.'); }
        function masayiKapat(id) { alert('Masa ' + id + ' kapatılıyor...'); }

        masalariGetir();
        setInterval(masalariGetir, 5000); // 5 saniyede bir güncelle
    </script>
</body>
</html>
