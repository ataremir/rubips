<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUBI PS | MANAGEMENT</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Orbitron', sans-serif; margin: 0; }
        .navbar { background: #111; padding: 15px; border-bottom: 2px solid #00f2ff; box-shadow: 0 0 15px #00f2ff; text-align: center; }
        .container { padding: 20px; }
        
        .stats { display: flex; justify-content: space-around; margin-bottom: 30px; background: #1a1a1a; padding: 15px; border-radius: 10px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .card { 
            background: linear-gradient(145deg, #111, #1a1a1a);
            border: 1px solid #333; border-radius: 15px; padding: 20px;
            text-align: center; transition: 0.4s;
        }
        .card.dolu { border-color: #ff0055; box-shadow: 0 0 20px #ff0055; }
        .card.bos { border-color: #00ff88; }

        .time-display { font-size: 35px; margin: 15px 0; font-weight: bold; color: #00f2ff; }
        
        button { 
            width: 100%; padding: 12px; border: none; border-radius: 8px; 
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-open { background: #00ff88; color: #000; }
        .btn-close { background: #ff0055; color: #fff; }
        .add-area { margin-top: 20px; text-align: center; }
        input { padding: 10px; border-radius: 5px; background: #222; color: #fff; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="navbar"><h1>RUBI PS ADMIN</h1></div>
    <div class="container">
        <div class="grid" id="masaListesi"></div>
        <div class="add-area">
            <input type="number" id="yeniMasaNo" placeholder="Masa No">
            <button onclick="masaEkle()" style="width: auto; background: #00f2ff;">+ MASA EKLE</button>
        </div>
    </div>

    <script>
        async function verileriYukle() {
            const res = await fetch('/api/masalar');
            const data = await res.json();
            const liste = document.getElementById('masaListesi');
            liste.innerHTML = '';

            data.forEach(m => {
                const card = document.createElement('div');
                card.className = `card ${m.durum}`;
                card.innerHTML = `
                    <h2 style="margin:0">MASA ${m.id}</h2>
                    <div class="time-display">${m.durum === 'dolu' ? m.kalan_dakika + ' dk' : 'KAPALI'}</div>
                    ${m.durum === 'bos' 
                        ? `<button class="btn-open" onclick="masaAc(${m.id})">SÜRE BAŞLAT (60 DK)</button>`
                        : `<button class="btn-close" onclick="masaKapat(${m.id})">MASAYI KAPAT / HESAP</button>`
                    }
                `;
                liste.appendChild(card);
            });
        }

        async function masaAc(id) {
            await fetch('/api/masa-ac', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id })
            });
            verileriYukle();
        }

        async function masaKapat(id) {
            if(confirm('Masa ' + id + ' hesabı kapatılsın mı?')) {
                await fetch('/api/masa-kapat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id })
                });
                verileriYukle();
            }
        }

        async function masaEkle() {
            const id = document.getElementById('yeniMasaNo').value;
            await fetch('/api/masa-ekle', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id })
            });
            verileriYukle();
        }

        setInterval(verileriYukle, 5000);
        verileriYukle();
    </script>
</body>
</html>
