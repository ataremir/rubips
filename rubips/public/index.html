<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCFH/SOFT V3.1 - STABIL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Audiowide&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon: #00f2ff; --pink: #ff0055; --bg: #050508; --panel: #0f0f16; }
        * { margin:0; padding:0; box-sizing: border-box; }
        body { background: var(--bg); color: #e0e0e0; font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; }

        /* KATMANLAR (Üst Üste Binmeyi Önler) */
        #loginScreen { z-index: 9999; }
        .modal-overlay { z-index: 8000; }
        #toast-container { z-index: 99999; }

        .app-container { display: none; height: 100vh; flex-direction: column; }
        .app-container.active { display: flex; }

        header { background: #0a0a10; border-bottom: 1px solid #222; padding: 10px 20px; flex-shrink: 0; }
        main { flex-grow: 1; overflow-y: auto; padding: 20px; }

        .tab-btn { padding: 8px 15px; cursor: pointer; color: #666; font-weight: bold; border-radius: 6px; transition: 0.3s; }
        .tab-btn.active { background: var(--neon); color: black; box-shadow: 0 0 15px var(--neon); }

        /* MASA KARTLARI */
        .masa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .card { background: var(--panel); border: 1px solid #222; border-radius: 12px; padding: 15px; cursor: pointer; position: relative; }
        .card.ps { border-top: 4px solid var(--neon); }
        .card.kafe { border-top: 4px solid var(--pink); }
        .card.dolu { background: rgba(255, 0, 85, 0.05); border-color: var(--pink); }
        .card.paused { border-color: #ffaa00; opacity: 0.7; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal-overlay.open { display: flex; }
        .modal-box { background: #0d0d12; border: 1px solid #333; padding: 25px; border-radius: 15px; width: 750px; max-width: 95%; max-height: 90vh; overflow-y: auto; }

        input, select, textarea { background: #1a1a24; border: 1px solid #333; padding: 10px; width: 100%; color: white; border-radius: 6px; margin-bottom: 10px; outline: none; }
        .btn { padding: 10px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-blue { background: var(--neon); color: black; }
        .btn-pink { background: var(--pink); color: white; }
        .btn-green { background: #00ff9d; color: black; }
        
        .hidden-view { display: none !important; }
        .admin-only { display: none; } /* JS ile açılacak */
    </style>
</head>
<body>

    <div id="loginScreen" class="fixed inset-0 bg-black flex items-center justify-center">
        <div class="bg-gray-900 p-10 rounded-2xl border-2 border-cyan-500 w-80 text-center">
            <h1 class="text-4xl font-bold text-cyan-400 mb-6" style="font-family:'Audiowide'">TCFH/SOFT</h1>
            <select id="loginUser" class="mb-4 bg-black"></select>
            <input type="password" id="loginPass" placeholder="ŞİFRE" class="text-center text-xl bg-black border-cyan-900" onkeypress="if(event.key==='Enter') login()">
            <button onclick="login()" class="btn btn-blue w-full">GİRİŞ</button>
        </div>
    </div>

    <div id="app" class="app-container">
        <header class="flex justify-between items-center">
            <div class="font-bold text-xl" style="font-family:'Audiowide'">TCFH<span class="text-cyan-400">/SOFT</span></div>
            <div class="flex gap-2">
                <button class="tab-btn active" onclick="setTab('masalar')">MASALAR</button>
                <button class="tab-btn" onclick="setTab('mutfak')">MUTFAK</button>
                <button class="tab-btn" onclick="setTab('nargile')">NARGİLE</button>
                <button class="tab-btn admin-view" onclick="setTab('muhasebe')">MUHASEBE</button>
                <button class="tab-btn admin-view" onclick="setTab('ayarlar')">AYARLAR</button>
            </div>
            <button onclick="location.reload()" class="text-red-500"><i class="fas fa-power-off"></i></button>
        </header>

        <main>
            <div id="view-masalar" class="tab-content">
                <div class="flex justify-between mb-4 admin-view">
                    <button onclick="openModal('modalMasaEkle')" class="bg-gray-800 px-4 py-2 rounded text-xs">+ YENİ MASA</button>
                </div>
                <div id="masaGrid" class="masa-grid"></div>
            </div>

            <div id="view-mutfak" class="tab-content hidden-view">
                <div id="mutfakGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>

            <div id="view-nargile" class="tab-content hidden-view">
                <div id="nargileGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>

            <div id="view-muhasebe" class="tab-content hidden-view">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="statsArea"></div>
                <div id="logList" class="bg-black p-4 rounded h-96 overflow-y-auto font-mono text-xs"></div>
            </div>

            <div id="view-ayarlar" class="tab-content hidden-view">
                <div class="grid grid-cols-2 gap-10">
                    <div id="urunYonetim"></div>
                    <div id="personelYonetim"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="modalMasa" class="modal-overlay">
        <div class="modal-box relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white text-2xl"><i class="fas fa-times"></i></button>
            <h2 id="mmBaslik" class="text-3xl font-bold mb-4">MASA</h2>
            
            <div class="grid grid-cols-12 gap-4 h-[450px]">
                <div class="col-span-4 bg-gray-900 rounded p-2 overflow-y-auto" id="mmUrunSec"></div>
                <div class="col-span-8 flex flex-col gap-2">
                    <div id="psPanel" class="bg-black p-3 rounded border border-cyan-900 hidden">
                        <div class="flex justify-between items-center">
                            <div id="mmSure" class="text-3xl font-mono font-bold text-cyan-400">00:00:00</div>
                            <button id="btnToggle" onclick="toggleTime()" class="bg-yellow-600 px-4 py-1 rounded text-black font-bold text-xs">DURDUR</button>
                        </div>
                    </div>
                    <textarea id="mmNot" placeholder="Masa Notu..." class="h-12 text-xs resize-none" onchange="saveNote()"></textarea>
                    <div class="flex-1 bg-gray-800 rounded p-2 overflow-y-auto" id="mmAdisyon"></div>
                    <div class="bg-gray-900 p-3 rounded">
                        <div class="flex justify-between text-2xl font-bold mb-2">
                            <span>TOPLAM:</span> <span id="mmToplam">₺0.00</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="openPay()" class="btn btn-green">ÖDEME AL</button>
                            <button onclick="toggleStaff()" id="btnStaff" class="bg-gray-700 rounded text-xs">PERSONEL FİYATI</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modalPay" class="modal-overlay">
        <div class="modal-box w-96 text-center">
            <h3 class="text-xl font-bold mb-4">ÖDEME</h3>
            <div class="text-4xl font-bold text-green-400 mb-4" id="pTotal">₺0.00</div>
            <div class="flex gap-2 mb-4">
                <div class="flex-1 bg-gray-900 p-2 rounded text-xs">Nakit: <span id="pCash">₺0</span></div>
                <div class="flex-1 bg-gray-900 p-2 rounded text-xs">Kart: <span id="pCard">₺0</span></div>
            </div>
            <input type="number" id="pInput" placeholder="Tutar Gir" class="text-center text-2xl">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="addPay('nakit')" class="btn btn-green">NAKİT EKLE</button>
                <button onclick="addPay('kart')" class="btn btn-blue">KART EKLE</button>
            </div>
            <button id="btnFinish" onclick="finishPay()" class="btn bg-gray-800 mt-4 w-full" disabled>TAMAMLA</button>
            <button onclick="document.getElementById('modalPay').classList.remove('open')" class="text-gray-500 text-xs mt-4">İPTAL</button>
        </div>
    </div>

    <div id="modalMasaEkle" class="modal-overlay">
        <div class="modal-box w-80">
            <h3 class="mb-4 font-bold text-xl">Yeni Masa</h3>
            <input id="nmAd" placeholder="Masa Adı">
            <select id="nmTur"><option value="ps">PlayStation</option><option value="kafe">Kafe/Nargile</option></select>
            <button onclick="addMasa()" class="btn btn-green w-full">OLUŞTUR</button>
        </div>
    </div>

    <script>
        // VERİTABANI
        const DB_KEY = 'tcfh_v31_stabil';
        let db = {
            masalar: [],
            urunler: [
                {id: 1, ad: 'Çay', kat: 'mutfak', fiyat: 20, pFiyat: 10, mal: 2},
                {id: 2, ad: 'Nargile', kat: 'nargile', fiyat: 300, pFiyat: 150, mal: 50}
            ],
            users: [{id: 1, name: 'Admin', role: 'admin', pass: '1907'}],
            logs: [],
            stats: { ciro: 0, ps: 0, kafe: 0, kar: 0 },
            psRate: 120
        };

        let curUser = null;
        let curMasa = null;
        let isStaff = false;
        let pData = { nakit: 0, kart: 0 };

        window.onload = () => {
            const saved = localStorage.getItem(DB_KEY);
            if(saved) db = JSON.parse(saved);
            document.getElementById('loginUser').innerHTML = db.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
            setInterval(tick, 1000);
        };

        function save() { localStorage.setItem(DB_KEY, JSON.stringify(db)); renderMasalar(); }

        function login() {
            const u = db.users.find(x => x.id == document.getElementById('loginUser').value);
            if(u.pass === document.getElementById('loginPass').value) {
                curUser = u;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('app').classList.add('active');
                if(u.role === 'admin') document.querySelectorAll('.admin-view').forEach(e => e.style.display = 'block');
                renderMasalar();
            } else alert('Şifre Yanlış');
        }

        function setTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden-view'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + tab).classList.remove('hidden-view');
            event.currentTarget.classList.add('active');
            if(tab === 'mutfak') renderOrders('mutfak');
            if(tab === 'nargile') renderOrders('nargile');
            if(tab === 'muhasebe') renderMuhasebe();
        }

        function renderMasalar() {
            const grid = document.getElementById('masaGrid');
            grid.innerHTML = '';
            db.masalar.forEach(m => {
                const calc = calculate(m);
                const div = document.createElement('div');
                div.className = `card ${m.tur} ${m.durum === 'dolu' ? 'dolu' : ''} ${m.isPaused ? 'paused' : ''}`;
                div.innerHTML = `
                    <div class="flex justify-between font-bold"><span>${m.ad}</span><i class="fas ${m.tur==='ps'?'fa-gamepad':'fa-coffee'} opacity-30"></i></div>
                    <div class="text-center mt-4">
                        <div class="text-xl font-bold">₺${calc.total.toFixed(2)}</div>
                        <div class="text-[10px] text-cyan-500 font-mono">${m.tur==='ps' ? (m.isPaused?'DURDU':calc.timeStr) : ''}</div>
                    </div>
                `;
                div.onclick = () => openMasa(m.id);
                grid.appendChild(div);
            });
        }

        function calculate(m, useStaff = false) {
            let tSec = m.accTime || 0;
            if(m.tur === 'ps' && m.start && !m.isPaused) tSec += (Date.now() - m.start) / 1000;
            const tCost = (db.psRate / 3600) * tSec;
            const pCost = m.orders.reduce((a, b) => {
                const u = db.urunler.find(x => x.ad === b.ad);
                return a + (useStaff ? u.pFiyat : b.fiyat);
            }, 0);
            const h = Math.floor(tSec/3600), mn = Math.floor((tSec%3600)/60), s = Math.floor(tSec%60);
            return { total: tCost + pCost, timeStr: `${h}:${mn<10?'0'+mn:mn}:${s<10?'0'+s:s}`, tCost, pCost };
        }

        function openMasa(id) {
            curMasa = db.masalar.find(x => x.id === id);
            isStaff = false;
            document.getElementById('modalMasa').classList.add('open');
            document.getElementById('mmBaslik').innerText = curMasa.ad;
            document.getElementById('mmNot').value = curMasa.not || '';
            document.getElementById('psPanel').style.display = curMasa.tur === 'ps' ? 'block' : 'none';
            document.getElementById('btnToggle').innerText = (curMasa.isPaused || (!curMasa.start && !curMasa.accTime)) ? 'BAŞLAT' : 'DURDUR';
            
            document.getElementById('mmUrunSec').innerHTML = db.urunler.map(u => `
                <div onclick="addOrder(${u.id})" class="bg-black p-2 mb-1 rounded text-xs border border-gray-800 cursor-pointer hover:border-cyan-500">${u.ad} (₺${u.fiyat})</div>
            `).join('');
            updateMasaUI();
        }

        function updateMasaUI() {
            if(!curMasa) return;
            const c = calculate(curMasa, isStaff);
            document.getElementById('mmSure').innerText = c.timeStr;
            document.getElementById('mmToplam').innerText = `₺${c.total.toFixed(2)}`;
            document.getElementById('btnStaff').className = isStaff ? 'bg-yellow-600 text-black text-xs p-1 rounded font-bold' : 'bg-gray-700 text-xs p-1 rounded';
            
            document.getElementById('mmAdisyon').innerHTML = curMasa.orders.map((o, i) => `
                <div class="flex justify-between text-xs border-b border-gray-700 py-1">
                    <span>${o.ad} (${o.status})</span>
                    <div class="flex gap-2"><span>₺${isStaff ? db.urunler.find(x=>x.ad===o.ad).pFiyat : o.fiyat}</span><i onclick="delOrder(${i})" class="fas fa-trash text-red-900 cursor-pointer"></i></div>
                </div>
            `).join('');
        }

        function tick() { renderMasalar(); if(curMasa) updateMasaUI(); }

        function toggleTime() {
            if(curMasa.isPaused || (!curMasa.start && !curMasa.accTime)) {
                curMasa.start = Date.now();
                curMasa.isPaused = false;
                curMasa.durum = 'dolu';
            } else {
                curMasa.accTime = (curMasa.accTime || 0) + (Date.now() - curMasa.start) / 1000;
                curMasa.start = null;
                curMasa.isPaused = true;
            }
            save(); openMasa(curMasa.id);
        }

        function addOrder(uid) {
            const u = db.urunler.find(x => x.id === uid);
            curMasa.orders.push({ ad: u.ad, fiyat: u.fiyat, kat: u.kat, status: 'bekliyor' });
            curMasa.durum = 'dolu';
            save(); updateMasaUI();
        }
        function delOrder(i) { curMasa.orders.splice(i, 1); save(); updateMasaUI(); }
        function saveNote() { curMasa.not = document.getElementById('mmNot').value; save(); }
        function toggleStaff() { isStaff = !isStaff; updateMasaUI(); }

        function openPay() {
            const c = calculate(curMasa, isStaff);
            pData = { nakit: 0, kart: 0 };
            document.getElementById('modalPay').classList.add('open');
            document.getElementById('pTotal').innerText = `₺${c.total.toFixed(2)}`;
            updatePayUI(c.total);
        }

        function addPay(t) {
            const val = parseFloat(document.getElementById('pInput').value) || 0;
            pData[t] += val;
            document.getElementById('pInput').value = '';
            updatePayUI(calculate(curMasa, isStaff).total);
        }

        function updatePayUI(total) {
            const paid = pData.nakit + pData.kart;
            const rem = Math.max(0, total - paid);
            document.getElementById('pCash').innerText = `₺${pData.nakit}`;
            document.getElementById('pCard').innerText = `₺${pData.kart}`;
            document.getElementById('btnFinish').disabled = rem > 0.5;
            document.getElementById('btnFinish').className = rem <= 0.5 ? 'btn btn-green w-full' : 'btn bg-gray-800 w-full';
        }

        function finishPay() {
            const c = calculate(curMasa, isStaff);
            db.stats.ciro += c.total;
            if(curMasa.tur==='ps') db.stats.ps += c.total; else db.stats.kafe += c.total;
            db.logs.unshift(`[${new Date().toLocaleTimeString()}] ${curMasa.ad} - ₺${c.total.toFixed(2)}`);
            curMasa.durum = 'bos'; curMasa.start = null; curMasa.accTime = 0; curMasa.orders = []; curMasa.isPaused = false;
            save(); document.getElementById('modalPay').classList.remove('open'); closeModal();
        }

        function renderOrders(cat) {
            const grid = document.getElementById(cat+'Grid'); grid.innerHTML = '';
            db.masalar.forEach(m => {
                m.orders.forEach((o, i) => {
                    if(o.kat === cat && o.status !== 'hazir') {
                        grid.innerHTML += `
                            <div class="bg-gray-900 p-3 rounded border-l-4 border-orange-500">
                                <div class="font-bold">${m.ad} - ${o.ad}</div>
                                <button onclick="setReady(${m.id}, ${i})" class="btn btn-green w-full mt-2 text-xs">HAZIR</button>
                            </div>
                        `;
                    }
                });
            });
        }
        function setReady(mid, idx) {
            const m = db.masalar.find(x => x.id === mid);
            m.orders[idx].status = 'hazir';
            save(); renderOrders(curUser.role === 'admin' ? 'mutfak' : curUser.role);
        }

        function openModal(id) { document.getElementById(id).classList.add('open'); }
        function closeModal() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open')); curMasa = null; }
        function addMasa() {
            db.masalar.push({ id: Date.now(), ad: document.getElementById('nmAd').value, tur: document.getElementById('nmTur').value, durum: 'bos', orders: [] });
            save(); closeModal();
        }
    </script>
</body>
</html>
