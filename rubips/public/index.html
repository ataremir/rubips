<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUBI PS & NARGİLE - PRO SİSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Audiowide&display=swap" rel="stylesheet">
    
    <style>
        /* TEMEL AYARLAR */
        :root { --neon-blue: #00f2ff; --neon-pink: #ff0055; --bg-dark: #050505; --panel-bg: rgba(20, 20, 35, 0.95); }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Rajdhani', sans-serif; background: var(--bg-dark); color: white; min-height: 100vh; overflow-x: hidden; }

        /* GİRİŞ EKRANI */
        #loginScreen { position: fixed; inset: 0; background: black; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--panel-bg); border: 2px solid var(--neon-blue); padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 0 50px rgba(0, 242, 255, 0.3); width: 350px; }
        
        /* ANA PANEL */
        .app-container { display: none; padding: 20px; max-width: 1600px; margin: 0 auto; }
        .app-container.active { display: block; }

        /* KARTLAR */
        .card { background: var(--panel-bg); border: 1px solid #333; border-radius: 15px; padding: 20px; transition: 0.3s; position: relative; }
        .card:hover { border-color: var(--neon-blue); transform: translateY(-3px); }
        
        /* MASA DURUMLARI */
        .masa-ps { border-left: 5px solid var(--neon-blue); }
        .masa-kafe { border-left: 5px solid var(--neon-pink); }
        .masa-dolu { background: rgba(255, 0, 85, 0.1); border-color: var(--neon-pink); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 rgba(255,0,85,0); } 50% { box-shadow: 0 0 15px rgba(255,0,85,0.3); } 100% { box-shadow: 0 0 0 rgba(255,0,85,0); } }

        /* BUTONLAR */
        .btn { padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; border: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-blue { background: var(--neon-blue); color: black; }
        .btn-pink { background: var(--neon-pink); color: white; }
        .btn-green { background: #00ff88; color: black; }
        .btn-outline { border: 1px solid #555; background: transparent; color: #aaa; }
        .btn:hover { filter: brightness(1.2); }

        /* TABLOLAR VE LİSTELER */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab-link { padding: 10px 20px; color: #777; cursor: pointer; font-size: 18px; font-weight: bold; }
        .tab-link.active { color: var(--neon-blue); border-bottom: 2px solid var(--neon-blue); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* SİPARİŞ DURUMLARI */
        .badge-bekliyor { background: #ffaa00; color: black; padding: 3px 8px; border-radius: 5px; font-size: 12px; }
        .badge-hazirlaniyor { background: #00aaff; color: white; padding: 3px 8px; border-radius: 5px; font-size: 12px; }
        .badge-hazir { background: #00ff88; color: black; padding: 3px 8px; border-radius: 5px; font-size: 12px; }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
        .modal.open { display: flex; }
        .modal-content { background: #111; padding: 30px; border-radius: 15px; border: 1px solid var(--neon-blue); width: 500px; max-width: 95%; max-height: 90vh; overflow-y: auto; }
        
        input, select { background: #222; border: 1px solid #444; color: white; padding: 10px; border-radius: 5px; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <h1 style="font-family: 'Audiowide'; color: var(--neon-blue); font-size: 30px; margin-bottom: 20px;">RUBI PS & CAFE</h1>
            <select id="userRole">
                <option value="admin">Yönetici (Admin)</option>
                <option value="mutfak">Mutfak Personeli</option>
                <option value="garson">Garson</option>
            </select>
            <input type="password" id="password" placeholder="Şifre Giriniz" onkeypress="if(event.key==='Enter') login()">
            <button class="btn btn-blue w-full justify-center" onclick="login()">GİRİŞ YAP</button>
        </div>
    </div>

    <div id="mainPanel" class="app-container">
        
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-3xl font-bold" style="font-family: 'Audiowide';"><span class="text-cyan-400">RUBI</span> YÖNETİM</h2>
                <span id="roleDisplay" class="text-gray-500 text-sm">Giriş Yapılmadı</span>
            </div>
            <div class="text-right">
                <div id="clock" class="text-2xl font-mono text-pink-500 font-bold">00:00:00</div>
                <button onclick="logout()" class="text-sm text-gray-400 hover:text-white mt-1">ÇIKIŞ YAP</button>
            </div>
        </div>

        <div class="tab-menu">
            <div class="tab-link active" onclick="setTab('masalar')"><i class="fas fa-couch"></i> Masalar</div>
            <div class="tab-link" onclick="setTab('mutfak')"><i class="fas fa-utensils"></i> Mutfak <span id="mutfakCount" class="bg-red-600 text-white text-xs px-2 rounded-full hidden">0</span></div>
            <div class="tab-link admin-only" onclick="setTab('urunler')"><i class="fas fa-box"></i> Ürünler</div>
            <div class="tab-link admin-only" onclick="setTab('rapor')"><i class="fas fa-chart-pie"></i> Raporlar</div>
            <div class="tab-link admin-only" onclick="setTab('ayarlar')"><i class="fas fa-cog"></i> Ayarlar</div>
        </div>

        <div id="tab-masalar" class="tab-content active">
            <div class="flex gap-2 mb-4 admin-only">
                <button onclick="openMasaEkleModal()" class="btn btn-green"><i class="fas fa-plus"></i> Yeni Masa Ekle</button>
                <div class="ml-auto flex gap-2">
                    <div class="bg-gray-800 px-4 py-2 rounded">PS: <span class="text-cyan-400 font-bold" id="psMasaCount">0</span></div>
                    <div class="bg-gray-800 px-4 py-2 rounded">Kafe: <span class="text-pink-500 font-bold" id="kafeMasaCount">0</span></div>
                </div>
            </div>

            <div id="masaGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                </div>
        </div>

        <div id="tab-mutfak" class="tab-content">
            <h3 class="text-xl font-bold mb-4 text-orange-400">Sipariş Takibi</h3>
            <div id="mutfakListesi" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                </div>
        </div>

        <div id="tab-urunler" class="tab-content">
            <div class="flex justify-between mb-4">
                <h3 class="text-xl font-bold">Ürün Yönetimi</h3>
                <button onclick="urunEkleModal()" class="btn btn-green">Ürün Ekle</button>
            </div>
            <div id="urunListesi" class="grid grid-cols-1 gap-2"></div>
        </div>

        <div id="tab-rapor" class="tab-content">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="card bg-gray-900"><div class="text-gray-400">Toplam Ciro</div><div class="text-3xl font-bold text-green-400" id="rapCiro">₺0</div></div>
                <div class="card bg-gray-900"><div class="text-gray-400">Net Kâr</div><div class="text-3xl font-bold text-cyan-400" id="rapKar">₺0</div></div>
                <div class="card bg-gray-900"><div class="text-gray-400">Giderler</div><div class="text-3xl font-bold text-red-400" id="rapGider">₺0</div></div>
                <div class="card bg-gray-900"><div class="text-gray-400">Açık Masalar</div><div class="text-3xl font-bold text-yellow-400" id="rapAcik">0</div></div>
            </div>
            <div class="bg-gray-900 p-4 rounded text-sm font-mono h-64 overflow-y-auto" id="logKaydi">
                </div>
        </div>

        <div id="tab-ayarlar" class="tab-content">
            <div class="max-w-md">
                <label>PS Saatlik Ücret (₺)</label>
                <input type="number" id="ayarPsUcret" value="100">
                <label>Admin Şifresi</label>
                <input type="text" id="ayarAdminPass" value="1907">
                <button onclick="ayarlariKaydet()" class="btn btn-blue w-full">KAYDET</button>
            </div>
        </div>

    </div>

    <div id="masaModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modalMasaAdi" class="text-2xl font-bold text-cyan-400">MASA DETAY</h2>
                <button onclick="closeModal()" class="text-red-500 text-2xl"><i class="fas fa-times"></i></button>
            </div>

            <div id="masaKapaliView">
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="masayiAc('sinirsiz')" class="btn btn-pink py-8 text-xl flex-col">
                        <i class="fas fa-infinity text-3xl mb-2"></i> SINIRSIZ (Taksimetre)
                        <span class="text-xs opacity-70 mt-1">Saniye saniye fiyat artar</span>
                    </button>
                    <button onclick="masayiAc('sureli')" class="btn btn-blue py-8 text-xl flex-col">
                        <i class="fas fa-clock text-3xl mb-2"></i> SÜRELİ AÇ
                        <span class="text-xs opacity-70 mt-1">Belirli dakika girilir</span>
                    </button>
                </div>
                <div id="sureSecimi" class="hidden mt-4">
                    <input type="number" id="dakikaInput" placeholder="Kaç Dakika? (Örn: 60)">
                    <button onclick="baslatSureli()" class="btn btn-green w-full">BAŞLAT</button>
                </div>
                <button onclick="masaSil()" class="btn btn-outline w-full mt-4 text-red-500 border-red-900 admin-only">MASAYI SİL</button>
            </div>

            <div id="masaAcikView" class="hidden">
                <div class="text-center mb-6">
                    <div class="text-gray-400">Geçen Süre / Kalan</div>
                    <div id="modalSayac" class="text-4xl font-mono font-bold text-white my-2">00:00:00</div>
                    <div id="modalUcret" class="text-3xl font-bold text-green-400">₺0.00</div>
                </div>

                <h4 class="font-bold border-b border-gray-700 pb-2 mb-2">Sipariş Ekle</h4>
                <div class="flex gap-2 mb-4">
                    <select id="siparisUrunSec" class="flex-1"></select>
                    <button onclick="siparisEkle()" class="btn btn-green"><i class="fas fa-plus"></i></button>
                </div>

                <div id="adisyonListesi" class="bg-gray-900 p-2 rounded mb-4 max-h-40 overflow-y-auto"></div>

                <div class="grid grid-cols-2 gap-2">
                    <button onclick="hesapKapat('nakit')" class="btn btn-green">NAKİT KAPAT</button>
                    <button onclick="hesapKapat('kart')" class="btn btn-blue">KART KAPAT</button>
                </div>
            </div>
        </div>
    </div>

    <div id="addMasaModal" class="modal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-4">Yeni Masa Ekle</h3>
            <label>Masa Adı</label>
            <input type="text" id="yeniMasaAd" placeholder="Örn: PS-5, Nargile-3">
            <label>Tür</label>
            <select id="yeniMasaTur">
                <option value="ps">PlayStation</option>
                <option value="kafe">Nargile / Kafe</option>
            </select>
            <button onclick="yeniMasaKaydet()" class="btn btn-green w-full">OLUŞTUR</button>
            <button onclick="document.getElementById('addMasaModal').classList.remove('open')" class="btn btn-outline w-full mt-2">İPTAL</button>
        </div>
    </div>

    <script>
        // --- VERİ TABANI (Local Storage) ---
        const DB_KEY = 'rubiProV4';
        let db = {
            masalar: [],
            urunler: [
                { id: 1, ad: 'Çay', fiyat: 10, maliyet: 2 },
                { id: 2, ad: 'Kahve', fiyat: 40, maliyet: 10 },
                { id: 3, ad: 'Nargile', fiyat: 250, maliyet: 50 },
                { id: 4, ad: 'Kola', fiyat: 30, maliyet: 15 }
            ],
            ayarlar: { psUcret: 100, adminPass: '1907', personelPass: '1234' },
            loglar: [],
            stats: { ciro: 0, kar: 0, gider: 0 }
        };

        let aktifKullanici = null; // 'admin', 'mutfak', 'garson'
        let seciliMasaId = null;
        let timerInterval = null;

        // --- BAŞLANGIÇ ---
        window.onload = function() {
            if(localStorage.getItem(DB_KEY)) db = JSON.parse(localStorage.getItem(DB_KEY));
            setInterval(updateClock, 1000);
            setInterval(globalTimer, 1000); // Tüm masaları her saniye güncelle
        };

        function kaydet() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            renderMasalar();
            renderMutfak();
        }

        // --- GİRİŞ İŞLEMLERİ ---
        function login() {
            const rol = document.getElementById('userRole').value;
            const pass = document.getElementById('password').value;
            
            if (rol === 'admin' && pass === db.ayarlar.adminPass) aktifKullanici = 'admin';
            else if (rol === 'mutfak' && pass === db.ayarlar.personelPass) aktifKullanici = 'mutfak';
            else if (rol === 'garson' && pass === db.ayarlar.personelPass) aktifKullanici = 'garson';
            else { alert('Hatalı Şifre!'); return; }

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainPanel').classList.add('active');
            document.getElementById('roleDisplay').textContent = rol.toUpperCase();

            // Yetkilendirme: Admin olmayanlardan bazı butonları gizle
            if(aktifKullanici !== 'admin') {
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            }
            
            // Eğer mutfak personeli ise direkt mutfak sekmesine git
            if(aktifKullanici === 'mutfak') setTab('mutfak');
            else renderMasalar();
        }

        function logout() { location.reload(); }

        // --- MASA YÖNETİMİ ---
        function renderMasalar() {
            const grid = document.getElementById('masaGrid');
            grid.innerHTML = '';
            let psSay = 0, kafeSay = 0;

            db.masalar.forEach(masa => {
                if(masa.tur === 'ps') psSay++; else kafeSay++;
                
                const kart = document.createElement('div');
                kart.className = `card ${masa.tur === 'ps' ? 'masa-ps' : 'masa-kafe'} ${masa.durum === 'dolu' ? 'masa-dolu' : ''}`;
                
                let sureBilgi = masa.durum === 'dolu' ? hesaplaSureVeUcret(masa).sureStr : 'BOŞ';
                let ucretBilgi = masa.durum === 'dolu' ? `₺${hesaplaSureVeUcret(masa).ucret.toFixed(2)}` : '';

                kart.onclick = () => openMasaDetay(masa.id);
                kart.innerHTML = `
                    <div class="flex justify-between">
                        <h3 class="font-bold text-xl">${masa.ad}</h3>
                        <i class="fas ${masa.tur === 'ps' ? 'fa-gamepad' : 'fa-coffee'} opacity-50"></i>
                    </div>
                    <div class="mt-4 text-center">
                        <div class="text-2xl font-mono font-bold">${sureBilgi}</div>
                        <div class="text-green-400 font-bold">${ucretBilgi}</div>
                    </div>
                    ${masa.siparisler.length > 0 ? `<div class="absolute top-2 right-2 bg-orange-500 text-xs px-2 rounded-full animate-bounce">${masa.siparisler.length}</div>` : ''}
                `;
                grid.appendChild(kart);
            });

            document.getElementById('psMasaCount').textContent = psSay;
            document.getElementById('kafeMasaCount').textContent = kafeSay;
        }

        // --- TAKSİMETRE MOTORU ---
        function hesaplaSureVeUcret(masa) {
            if (masa.durum === 'bos') return { sureStr: '00:00:00', ucret: 0 };

            const simdi = Date.now();
            const gecenSaniye = Math.floor((simdi - masa.baslangic) / 1000);
            
            // Saatlik ücret saniyeye bölünür (Örn: 100 TL / 3600 sn = 0.027 TL/sn)
            const saniyelikUcret = masa.tur === 'ps' ? (db.ayarlar.psUcret / 3600) : 0; 
            let ucret = gecenSaniye * saniyelikUcret;

            // Süreli açıldıysa ve süre bittiyse?
            if(masa.tip === 'sureli') {
                const kalanSaniye = (masa.hedefSure * 60) - gecenSaniye;
                if(kalanSaniye <= 0) {
                    ucret = (masa.hedefSure * 60) * saniyelikUcret; // Fiyat durur
                    return { sureStr: "SÜRE BİTTİ", ucret: ucret, bitti: true };
                }
                // Geri sayım
                const h = Math.floor(kalanSaniye / 3600);
                const m = Math.floor((kalanSaniye % 3600) / 60);
                const s = kalanSaniye % 60;
                return { sureStr: `${pad(h)}:${pad(m)}:${pad(s)}`, ucret: ucret };
            }

            // Sınırsız (Taksimetre)
            const h = Math.floor(gecenSaniye / 3600);
            const m = Math.floor((gecenSaniye % 3600) / 60);
            const s = gecenSaniye % 60;
            return { sureStr: `${pad(h)}:${pad(m)}:${pad(s)}`, ucret: ucret };
        }

        function globalTimer() {
            renderMasalar();
            if(seciliMasaId) updateModalContent(); // Modal açıksa onu da güncelle
        }

        // --- MASA DETAYLARI ---
        function openMasaDetay(id) {
            seciliMasaId = id;
            const masa = db.masalar.find(m => m.id === id);
            document.getElementById('modalMasaAdi').textContent = masa.ad;
            
            const modal = document.getElementById('masaModal');
            modal.classList.add('open');

            if(masa.durum === 'bos') {
                document.getElementById('masaKapaliView').style.display = 'block';
                document.getElementById('masaAcikView').style.display = 'none';
                document.getElementById('sureSecimi').classList.add('hidden');
            } else {
                document.getElementById('masaKapaliView').style.display = 'none';
                document.getElementById('masaAcikView').style.display = 'block';
                renderAdisyon(masa);
            }
            
            // Ürün listesini doldur
            const select = document.getElementById('siparisUrunSec');
            select.innerHTML = '';
            db.urunler.forEach(u => {
                select.innerHTML += `<option value="${u.id}">${u.ad} - ₺${u.fiyat}</option>`;
            });
        }

        function masayiAc(tip) {
            if(tip === 'sureli') {
                document.getElementById('sureSecimi').classList.remove('hidden');
            } else {
                baslatMasa('sinirsiz', 0);
            }
        }

        function baslatSureli() {
            const dk = parseInt(document.getElementById('dakikaInput').value);
            if(!dk) return alert('Dakika giriniz!');
            baslatMasa('sureli', dk);
        }

        function baslatMasa(tip, hedefSure) {
            const masa = db.masalar.find(m => m.id === seciliMasaId);
            masa.durum = 'dolu';
            masa.baslangic = Date.now();
            masa.tip = tip;
            masa.hedefSure = hedefSure;
            
            kaydet();
            openMasaDetay(seciliMasaId); // Ekranı yenile
        }

        function updateModalContent() {
            const masa = db.masalar.find(m => m.id === seciliMasaId);
            if(!masa || masa.durum === 'bos') return;

            const veri = hesaplaSureVeUcret(masa);
            document.getElementById('modalSayac').textContent = veri.sureStr;
            
            // Toplam Hesap = Zaman Ücreti + Adisyon
            const adisyonToplami = masa.siparisler.reduce((acc, s) => acc + s.fiyat, 0);
            const toplam = veri.ucret + adisyonToplami;
            
            document.getElementById('modalUcret').textContent = `₺${toplam.toFixed(2)}`;
            if(veri.bitti) document.getElementById('modalSayac').classList.add('text-red-500');
        }

        function siparisEkle() {
            const urunId = parseInt(document.getElementById('siparisUrunSec').value);
            const urun = db.urunler.find(u => u.id === urunId);
            const masa = db.masalar.find(m => m.id === seciliMasaId);
            
            // Mutfak için sipariş objesi
            const yeniSiparis = {
                id: Date.now(),
                urunAd: urun.ad,
                fiyat: urun.fiyat,
                durum: 'bekliyor', // bekliyor -> hazirlaniyor -> hazir
                saat: new Date().toLocaleTimeString()
            };
            
            masa.siparisler.push(yeniSiparis);
            kaydet();
            renderAdisyon(masa);
        }

        function renderAdisyon(masa) {
            const list = document.getElementById('adisyonListesi');
            list.innerHTML = '';
            masa.siparisler.forEach(s => {
                let badgeClass = s.durum === 'bekliyor' ? 'badge-bekliyor' : (s.durum === 'hazirlaniyor' ? 'badge-hazirlaniyor' : 'badge-hazir');
                list.innerHTML += `
                    <div class="flex justify-between items-center border-b border-gray-700 py-1">
                        <div>
                            <span>${s.urunAd}</span>
                            <span class="${badgeClass} ml-2">${s.durum.toUpperCase()}</span>
                        </div>
                        <div>₺${s.fiyat}</div>
                    </div>
                `;
            });
        }

        function hesapKapat(tur) {
            if(!confirm('Hesap kapatılsın mı?')) return;
            const masa = db.masalar.find(m => m.id === seciliMasaId);
            const veri = hesaplaSureVeUcret(masa);
            
            const adisyonToplami = masa.siparisler.reduce((acc, s) => acc + s.fiyat, 0);
            const toplamTutar = veri.ucret + adisyonToplami;
            
            // İstatistikleri Güncelle
            db.stats.ciro += toplamTutar;
            db.stats.kar += (toplamTutar * 0.6); // Basit kar hesabı (maliyet sistemi eklenebilir)
            
            // Log Kaydı
            db.loglar.unshift({
                tarih: new Date().toLocaleString(),
                masa: masa.ad,
                tutar: toplamTutar.toFixed(2),
                odeme: tur,
                detay: `${masa.siparisler.length} ürün`
            });

            // Masayı Sıfırla
            masa.durum = 'bos';
            masa.baslangic = null;
            masa.siparisler = [];
            
            kaydet();
            closeModal();
            renderRapor();
        }

        // --- MUTFAK SİSTEMİ ---
        function renderMutfak() {
            const list = document.getElementById('mutfakListesi');
            list.innerHTML = '';
            let bekleyenSayisi = 0;

            db.masalar.forEach(masa => {
                masa.siparisler.forEach(siparis => {
                    if(siparis.durum !== 'hazir') { // Hazır olanları mutfaktan kaldırabiliriz veya 'teslim edildi' yapabiliriz
                        bekleyenSayisi++;
                        const div = document.createElement('div');
                        div.className = 'card bg-gray-800 border-l-4 ' + (siparis.durum === 'bekliyor' ? 'border-orange-500' : 'border-blue-500');
                        div.innerHTML = `
                            <div class="flex justify-between mb-2">
                                <span class="font-bold text-lg">${masa.ad}</span>
                                <span class="text-gray-400 text-sm">${siparis.saat}</span>
                            </div>
                            <div class="text-xl font-bold mb-4">${siparis.urunAd}</div>
                            <button onclick="mutfakDurumDegistir(${masa.id}, ${siparis.id})" class="btn w-full ${siparis.durum === 'bekliyor' ? 'btn-blue' : 'btn-green'}">
                                ${siparis.durum === 'bekliyor' ? 'HAZIRLAMAYA BAŞLA' : 'HAZIR OLDU (BİLDİR)'}
                            </button>
                        `;
                        list.appendChild(div);
                    }
                });
            });
            
            const rozet = document.getElementById('mutfakCount');
            if(bekleyenSayisi > 0) {
                rozet.textContent = bekleyenSayisi;
                rozet.classList.remove('hidden');
            } else {
                rozet.classList.add('hidden');
            }
        }

        function mutfakDurumDegistir(masaId, siparisId) {
            const masa = db.masalar.find(m => m.id === masaId);
            const siparis = masa.siparisler.find(s => s.id === siparisId);
            
            if(siparis.durum === 'bekliyor') siparis.durum = 'hazirlaniyor';
            else if(siparis.durum === 'hazirlaniyor') siparis.durum = 'hazir';
            
            kaydet();
        }

        // --- YARDIMCI FONKSİYONLAR ---
        function setTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-link').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            // Buton aktifliği
            event.target.classList.add('active');
            
            if(tabId === 'mutfak') renderMutfak();
            if(tabId === 'rapor') renderRapor();
        }

        function openMasaEkleModal() { document.getElementById('addMasaModal').classList.add('open'); }
        function yeniMasaKaydet() {
            const ad = document.getElementById('yeniMasaAd').value;
            const tur = document.getElementById('yeniMasaTur').value;
            if(!ad) return alert('Ad girin');
            
            const yeniId = Date.now(); // Basit ID
            db.masalar.push({ id: yeniId, ad: ad, tur: tur, durum: 'bos', siparisler: [] });
            kaydet();
            document.getElementById('addMasaModal').classList.remove('open');
        }
        
        function masaSil() {
            if(confirm('Masa tamamen silinecek! Emin misin?')) {
                db.masalar = db.masalar.filter(m => m.id !== seciliMasaId);
                kaydet();
                closeModal();
            }
        }

        function renderRapor() {
            document.getElementById('rapCiro').textContent = `₺${db.stats.ciro.toFixed(2)}`;
            document.getElementById('rapKar').textContent = `₺${db.stats.kar.toFixed(2)}`;
            
            const logDiv = document.getElementById('logKaydi');
            logDiv.innerHTML = '';
            db.loglar.forEach(log => {
                logDiv.innerHTML += `<div class="border-b border-gray-700 py-1 text-gray-300">[${log.tarih}] ${log.masa} - ₺${log.tutar} (${log.odeme})</div>`;
            });
        }

        function closeModal() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('open'));
            seciliMasaId = null;
        }
        
        function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }
        function pad(n) { return n < 10 ? '0' + n : n; }

    </script>
</body>
</html>
